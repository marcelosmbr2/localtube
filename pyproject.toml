[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localtube"
version = "0.1.0"
description = "LocalTube - aplicação desktop em PySide6 (Qt Widgets)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.10",
]

[project.scripts]
localtube = "localtube.app:main"

[tool.setuptools.packages.find]
where = ["src"]
