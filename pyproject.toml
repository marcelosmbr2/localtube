[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localtube"
version = "0.1.0"
description = "LocalTube - aplicação desktop em PySide6 (Qt Widgets)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.10",
    "yt-dlp>=2026.10.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
]
build = [
    "pyinstaller>=6.16",
]

[project.scripts]
localtube = "localtube.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localtube = ["resources/*.svg", "resources/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
